openapi: 3.2.0
info:
  title: API for testing Schema-First
  version: 1.0.0
paths:
  /endpoint:
    get:
      responses:
        '200':
          description: Response item.
          content:
            application/json:
              schema:
                type: object
                properties:
                  field:
                    type: integer
                    minimum: -1
                    maximum: 1
