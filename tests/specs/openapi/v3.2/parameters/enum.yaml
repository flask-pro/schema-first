openapi: 3.2.0
info:
  title: API for testing Schema-First
  version: 1.0.0
paths:
  /mini_endpoint/{path}:
    parameters:
    - name: query
      in: query
      schema:
        type: string
        enum:
        - query_param
    - name: header
      in: header
      schema:
        type: string
        enum:
        - header_param
    - name: cookie
      in: cookie
      schema:
        type: string
        enum:
        - cookie_param
    - $ref: '#/components/parameters/path'
    get:
      responses:
        '200':
          description: Response item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
components:
  schemas:
    Item:
      type: object
      properties:
        message:
          type: string
  parameters:
    path:
      name: path
      in: path
      required: true
      schema:
        type: string
        enum:
        - path_param
